<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Espace admin — Inscrits</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef5ff,#fff);min-height:100vh;padding:30px 16px;color:#0b3a63;}
    .wrap{max-width:1100px;margin:0 auto;}
    .logos{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
    .logos img{height:60px;object-fit:contain;mix-blend-mode:multiply;}
    .carte{background:#fff;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.12);padding:30px;}
    h1{font-size:26px;color:#0b66c3;margin-bottom:6px;}
    .sub{color:#5b7a95;font-size:14px;margin-bottom:20px;}
    #login{max-width:380px;margin:40px auto;text-align:center;}
    input[type=password],input[type=search]{width:100%;padding:14px;border:2px solid #dfe5ec;border-radius:12px;font-size:16px;transition:.3s;}
    input:focus{outline:none;border-color:#0b66c3;box-shadow:0 0 10px rgba(11,102,195,.25);}
    button{padding:14px 20px;background:#0b66c3;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer;transition:.3s;}
    button:hover{background:#094f98;}
    button.sec{background:#eef5ff;color:#0b66c3;}
    button.sec:hover{background:#dbe9fb;}
    #login button{width:100%;margin-top:14px;}
    .erreur{color:#c0392b;font-size:14px;margin-top:12px;min-height:18px;}
    #app{display:none;}
    .barre{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
    .barre input{flex:1;min-width:200px;}
    .compteur{background:#e8f6ec;color:#1f8a47;font-weight:bold;padding:10px 16px;border-radius:12px;font-size:14px;}
    .table-wrap{overflow-x:auto;border:1px solid #e2ecf8;border-radius:14px;}
    table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px;}
    th{background:#f6faff;text-align:left;padding:12px 14px;color:#0b3a63;font-size:13px;white-space:nowrap;}
    td{padding:12px 14px;border-top:1px solid #eef3f9;}
    tr:hover td{background:#fafcff;}
    .id{font-weight:bold;color:#0b66c3;white-space:nowrap;}
    .vide{text-align:center;color:#5b7a95;padding:30px;}
</style>
</head>
<body>
<div class="wrap">
    <div class="logos">
        <img src="./images/oneprocom.jpeg" alt="One Pro Com">
        <img src="./images/robotique.png" alt="L Partners - Innovation &amp; Technology">
    </div>

    <div class="carte">
        <div id="login">
            <h1>Espace admin</h1>
            <p class="sub">Entrez le mot de passe pour consulter les inscrits.</p>
            <input type="password" id="mdp" placeholder="Mot de passe" autocomplete="current-password">
            <button id="btn-connexion">Se connecter</button>
            <p class="erreur" id="erreur"></p>
        </div>

        <div id="app">
            <h1>Inscrits</h1>
            <p class="sub">Liste en temps réel des personnes inscrites.</p>
            <div class="barre">
                <span class="compteur" id="compteur">0 inscrit</span>
                <input type="search" id="recherche" placeholder="Rechercher (nom, email, profession, ID…)">
                <button class="sec" id="btn-actualiser">Actualiser</button>
                <button id="btn-csv">Exporter (Excel/CSV)</button>
                <button class="sec" id="btn-deconnexion">Déconnexion</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Date</th><th>Nom</th><th>Prénom</th><th>Email</th><th>Téléphone</th><th>Profession</th></tr></thead>
                    <tbody id="corps"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let inscrits = [];
    let motDePasse = sessionStorage.getItem('admin_mdp') || '';

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'}); };

    async function charger() {
        $('erreur').textContent = '';
        try {
            const r = await fetch('/api/admin', { headers: { 'X-Admin-Password': motDePasse }, cache: 'no-store' });
            const data = await r.json();
            if (!r.ok) throw new Error(data.erreur || 'Erreur');
            inscrits = data.inscrits;
            sessionStorage.setItem('admin_mdp', motDePasse);
            $('login').style.display = 'none';
            $('app').style.display = 'block';
            afficher();
        } catch (e) {
            sessionStorage.removeItem('admin_mdp');
            $('login').style.display = 'block';
            $('app').style.display = 'none';
            $('erreur').textContent = e.message;
        }
    }

    function filtres() {
        const q = $('recherche').value.trim().toLowerCase();
        if (!q) return inscrits;
        return inscrits.filter(i => Object.values(i).join(' ').toLowerCase().includes(q));
    }

    function afficher() {
        const liste = filtres();
        $('compteur').textContent = `${inscrits.length} inscrit${inscrits.length > 1 ? 's' : ''}` +
            (liste.length !== inscrits.length ? ` · ${liste.length} affiché${liste.length > 1 ? 's' : ''}` : '');
        $('corps').innerHTML = liste.length ? liste.map(i => `
            <tr>
                <td class="id">${esc(i.id)}</td>
                <td>${esc(fmtDate(i.date))}</td>
                <td>${esc(i.nom)}</td>
                <td>${esc(i.prenom)}</td>
                <td>${esc(i.email)}</td>
                <td>${esc(i.telephone)}</td>
                <td>${esc(i.profession)}</td>
            </tr>`).join('') : '<tr><td class="vide" colspan="7">Aucun inscrit pour le moment.</td></tr>';
    }

    function exporterCsv() {
        const cols = ['id','date','nom','prenom','email','telephone','profession'];
        const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
        const lignes = [cols.join(';')].concat(filtres().map(i => cols.map(c => cell(c === 'date' ? fmtDate(i.date) : i[c])).join(';')));
        const blob = new Blob(['\ufeff' + lignes.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `inscrits-${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    $('btn-connexion').onclick = () => { motDePasse = $('mdp').value; charger(); };
    $('mdp').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-connexion').click(); });
    $('btn-actualiser').onclick = charger;
    $('btn-csv').onclick = exporterCsv;
    $('recherche').addEventListener('input', afficher);
    $('btn-deconnexion').onclick = () => { sessionStorage.removeItem('admin_mdp'); location.reload(); };

    if (motDePasse) charger();
</script>
</body>
</html>
